name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    env:
      MPLBACKEND: Agg
      KIVY_NO_ARGS: "1"
      KIVY_WINDOW: sdl2
      AIEVA_OFFLINE_MODE: "true"
      AIEVA_MOCK_LLM: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-server.txt -r requirements-dev.txt

      - name: Install system libraries (Kivy)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libsdl2-2.0-0 libsdl2-image-2.0-0 libsdl2-mixer-2.0-0 libsdl2-ttf-2.0-0 \
            libmtdev1 xclip xsel xvfb libgl1-mesa-dri

      - name: Ruff
        run: ruff check .

      - name: Black (check only)
        run: black --check .

      - name: Pytest (headless)
        run: xvfb-run -a python -m pytest -v --cov=aieva --cov=server --cov-report=term-missing

      - name: Smoke - server starts in mock mode
        run: |
          AIEVA_MOCK_LLM=true python -c "
          from fastapi.testclient import TestClient
          from server.main import create_app
          client = TestClient(create_app())
          assert client.get('/health').status_code == 200
          print('server ok')
          "
